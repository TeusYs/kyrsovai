{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="centered">
    <h2>Вход в систему</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <fieldset>
            <legend>Кто вы?</legend>
            <label>
                <input type="radio" name="role" value="applicant" checked>
                Я абитуриент
            </label><br>
            <label>
                <input type="radio" name="role" value="specialist">
                Я сотрудник приёмной комиссии
            </label>
        </fieldset>

        <label>Email / Логин</label>
        <input type="text" name="username" required>

        <label>Пароль</label>
        <input type="password" name="password" required>

        <button type="submit">Войти</button>
    </form>

    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
